name: windows exe

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true
      - name: Generate the Windows project
        working-directory: client
        run: flutter create --org dev.selfstream --project-name selfstream --platforms windows .
      - name: Dependencies
        working-directory: client
        run: flutter pub get
      - name: Analyze
        working-directory: client
        run: flutter analyze --no-fatal-infos 2>&1 | tee ../win-analyze.log
      - name: Build
        working-directory: client
        run: set -o pipefail; flutter build windows --release 2>&1 | tee ../win-build.log
      - name: Zip
        run: |
          cd client/build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/selfstream-windows.zip" ./*
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' client/pubspec.yaml | sed 's/version: *//')
          gh release delete windows-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create windows-latest selfstream-windows.zip --prerelease \
            --title "Selfstream for Windows $VERSION" \
            --notes "Unzip, keep the folder together, run selfstream.exe. Built from $GITHUB_SHA."
      - name: Keep the log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/logs && cp win-*.log /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs && git init -q && git checkout -q -b windows-logs
          git -c user.name=ci -c user.email=ci@example.com add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "windows log" || exit 0
          git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" windows-logs
