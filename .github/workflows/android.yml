name: android apk
on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOG: ${{ github.workspace }}/ci.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true
      - name: Versions
        run: |
          set -o pipefail
          { flutter --version; java -version; } 2>&1 | tee -a "$LOG"
      - name: Generate the Android project
        working-directory: client
        run: |
          set -o pipefail
          flutter create --org dev.selfstream --project-name selfstream --platforms android . 2>&1 | tee -a "$LOG"
          python3 tool/patch_android.py 2>&1 | tee -a "$LOG"
      - name: Dependencies
        working-directory: client
        run: set -o pipefail; flutter pub get 2>&1 | tee -a "$LOG"
      - name: Analyze
        working-directory: client
        run: set -o pipefail; flutter analyze --no-fatal-infos 2>&1 | tee -a "$LOG"
      - name: Test
        working-directory: client
        run: set -o pipefail; flutter test 2>&1 | tee -a "$LOG"
      - name: Build APK
        working-directory: client
        run: set -o pipefail; flutter build apk --release 2>&1 | tee -a "$LOG"
      - name: Sign
        run: |
          set -o pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks client/signing/selfstream.jks --ks-pass pass:selfstream-sideload \
            --key-pass pass:selfstream-sideload --out selfstream.apk client/build/app/outputs/flutter-apk/app-release.apk 2>&1 | tee -a "$LOG"
          "$BT/apksigner" verify --print-certs selfstream.apk 2>&1 | tee -a "$LOG"
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          VERSION=$(grep '^version:' client/pubspec.yaml | sed 's/version: *//')
          cp selfstream.apk "selfstream-$VERSION-${{ github.run_number }}.apk"
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest --prerelease --title "Selfstream app (build ${{ github.run_number }})" \
            --notes "Android APK built from ${{ github.sha }}. Install over the previous version; the signing key is the same." \
            "selfstream-$VERSION-${{ github.run_number }}.apk" 2>&1 | tee -a "$LOG"
      - name: Publish the build log
        if: always()
        run: |
          mkdir -p /tmp/lg && cd /tmp/lg
          { echo "job status: ${{ job.status }}   commit: ${{ github.sha }}   run: ${{ github.run_id }}"; tail -c 900000 "$LOG" 2>/dev/null || echo "(no log)"; } > build.log
          git init -q && git config user.name ci && git config user.email ci@example.com
          git checkout -q -b ci-logs && git add -A && git commit -q -m "build log for ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
