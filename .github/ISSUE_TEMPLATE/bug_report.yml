name: Bug report
description: Something does not work on the server
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: input
    id: setup
    attributes:
      label: How it is installed (Proxmox script, Docker, other) and on what CPU (x86 / ARM)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Output of `journalctl -u selfstream -n 80 --no-pager` (remove anything private)."
      render: text
