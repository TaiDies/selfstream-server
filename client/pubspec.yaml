name: selfstream
description: Self-hosted music player for selfstream / Navidrome.
publish_to: "none"
version: 0.3.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  crypto: ^3.0.6
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
